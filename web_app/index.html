<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Tasky</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            overflow: hidden;
        }

        .app-wrapper {
            max-width: 420px;
            width: 100%;
            height: 780px;
            max-height: 95vh;
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.06);
            overflow: hidden;
            position: relative;
        }

        /* ===== КОНТЕЙНЕР СТРАНИЦ ===== */
        .pages-container {
            display: flex;
            height: 100%;
            width: 300%;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateX(-33.333%);
        }

        .page {
            width: 33.333%;
            height: 100%;
            padding: 24px 20px 100px;
            overflow-y: auto;
            background: #ffffff;
            flex-shrink: 0;
        }

        .page::-webkit-scrollbar { width: 0; }

        /* СТРАНИЦА 1: ВСЕ ЗАПИСИ (слева) */
        .page-all { order: 1; }

        /* СТРАНИЦА 2: ГЛАВНАЯ (центр) */
        .page-main { order: 2; }

        /* СТРАНИЦА 3: СПИСОК ЗАДАЧ (справа) */
        .page-tasks { order: 3; }

        /* ===== НИЖНЯЯ ПАНЕЛЬ (3 КНОПКИ) ===== */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 72px;
            background: #ffffff;
            border-top: 1px solid #f1f3f7;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 20px 8px;
            z-index: 10;
        }

        .nav-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #b8c4d6;
            transition: all 0.3s ease;
            padding: 8px 16px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            font-family: inherit;
            position: relative;
        }

        .nav-btn.active { color: #6c5ce7; }
        .nav-btn .label { font-size: 9px; font-weight: 500; color: inherit; }
        .nav-btn .badge {
            position: absolute;
            top: 0;
            right: 4px;
            background: #e74c3c;
            color: #fff;
            font-size: 9px;
            font-weight: 600;
            padding: 1px 6px;
            border-radius: 10px;
            min-width: 18px;
            text-align: center;
        }
        .nav-btn .badge.hidden { display: none; }

        /* ===== ГЛАВНАЯ ===== */
        .greeting { font-size: 22px; font-weight: 700; color: #0b1a33; margin-bottom: 4px; }
        .greeting-sub { font-size: 14px; color: #8e9aaf; margin-bottom: 24px; }

        .calendar-mini {
            background: #f7f9fc;
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 24px;
        }

        .calendar-mini-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .calendar-mini-header .month { font-weight: 600; font-size: 15px; color: #0b1a33; }
        .calendar-mini-header button {
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            color: #8e9aaf;
            padding: 4px 10px;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .calendar-mini-header button:hover { background: #e6eaf0; }

        .calendar-mini-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 11px;
            font-weight: 500;
            color: #8e9aaf;
            margin-bottom: 6px;
        }

        .calendar-mini-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .calendar-mini-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #0b1a33;
            position: relative;
        }

        .calendar-mini-day:hover { background: #e6eaf0; }
        .calendar-mini-day.today { background: #6c5ce7; color: #fff; font-weight: 600; }
        .calendar-mini-day.has-event { background: #6c5ce7; color: #fff; }
        .calendar-mini-day.empty { cursor: default; }
        .calendar-mini-day.empty:hover { background: transparent; }
        .calendar-mini-day.selected { border: 2px solid #6c5ce7; }

        /* ===== THIS WEEK ===== */
        .week-section { margin-bottom: 24px; }
        .week-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .week-title { font-size: 16px; font-weight: 600; color: #0b1a33; }
        .week-stats { font-size: 13px; color: #8e9aaf; }
        .week-stats span { font-weight: 600; color: #0b1a33; }

        .week-list { list-style: none; padding: 0; }
        .week-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: #f7f9fc;
            border-radius: 14px;
            margin-bottom: 6px;
            transition: all 0.2s ease;
            animation: slideUp 0.3s ease;
        }
        .week-item.done { opacity: 0.5; }
        .week-item.done .week-item-text { text-decoration: line-through; color: #aab4c6; }

        .week-item-check {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid #d0d7e6;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s ease;
            font-size: 12px;
            background: #fff;
        }
        .week-item-check.done { background: #6c5ce7; border-color: #6c5ce7; color: #fff; }

        .week-item-text { flex: 1; font-size: 14px; color: #0b1a33; }
        .week-item-delete {
            background: none;
            border: none;
            color: #b8c4d6;
            cursor: pointer;
            font-size: 16px;
            transition: color 0.2s;
        }
        .week-item-delete:hover { color: #e74c3c; }

        /* ===== ЗАМЕТКИ ===== */
        .notes-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 24px;
        }

        .note-card {
            background: #f7f9fc;
            border-radius: 16px;
            padding: 14px;
            transition: all 0.2s ease;
            animation: slideUp 0.3s ease;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .note-card:hover { background: #f1f3f7; transform: translateY(-2px); }
        .note-card-text { font-size: 13px; color: #0b1a33; word-break: break-word; margin-bottom: 8px; }
        .note-card-footer { display: flex; justify-content: space-between; align-items: center; }
        .note-card-date { font-size: 10px; color: #8e9aaf; }
        .note-card-delete {
            background: none;
            border: none;
            color: #b8c4d6;
            cursor: pointer;
            font-size: 14px;
            transition: color 0.2s;
        }
        .note-card-delete:hover { color: #e74c3c; }

        /* ===== СТРАНИЦА ЗАДАЧ ===== */
        .page-title { font-size: 20px; font-weight: 700; color: #0b1a33; margin-bottom: 20px; }
        .task-list { list-style: none; padding: 0; }

        .task-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            background: #f7f9fc;
            border-radius: 14px;
            margin-bottom: 8px;
            transition: all 0.2s ease;
            animation: slideUp 0.3s ease;
        }
        .task-item.done { opacity: 0.5; }
        .task-item.done .task-text { text-decoration: line-through; color: #aab4c6; }

        .task-check {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid #d0d7e6;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s ease;
            font-size: 13px;
            background: #fff;
        }
        .task-check.done { background: #6c5ce7; border-color: #6c5ce7; color: #fff; }

        .task-text { flex: 1; font-size: 14px; color: #0b1a33; }
        .task-delete {
            background: none;
            border: none;
            color: #b8c4d6;
            cursor: pointer;
            font-size: 18px;
            transition: color 0.2s;
        }
        .task-delete:hover { color: #e74c3c; }

        /* ===== ВСЕ ЗАПИСИ ===== */
        .all-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: #f7f9fc;
            border-radius: 14px;
            margin-bottom: 6px;
            transition: all 0.2s ease;
            animation: slideUp 0.3s ease;
        }

        .all-item .type-badge {
            font-size: 11px;
            font-weight: 500;
            padding: 2px 10px;
            border-radius: 20px;
            flex-shrink: 0;
            margin-right: 10px;
        }
        .all-item .type-badge.task { background: #e8f0fe; color: #4a7bc7; }
        .all-item .type-badge.event { background: #fef3e8; color: #c77a4a; }
        .all-item .type-badge.note { background: #e8fef0; color: #4ac77a; }

        .all-item .all-text { flex: 1; font-size: 13px; color: #0b1a33; word-break: break-word; }
        .all-item .all-delete {
            background: none;
            border: none;
            color: #b8c4d6;
            cursor: pointer;
            font-size: 16px;
            transition: color 0.2s;
            flex-shrink: 0;
            margin-left: 8px;
        }
        .all-item .all-delete:hover { color: #e74c3c; }

        .empty-state { text-align: center; color: #b8c4d6; padding: 40px 0; font-size: 14px; }

        /* ===== ВСПЛЫВАЮЩИЕ ОКНА ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            z-index: 999;
            align-items: flex-end;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }
        .modal-overlay.active { display: flex; }

        .modal {
            background: #ffffff;
            border-radius: 28px 28px 0 0;
            padding: 24px 20px 32px;
            width: 100%;
            max-width: 420px;
            animation: slideUpModal 0.3s ease;
        }
        .modal-title { font-size: 18px; font-weight: 600; color: #0b1a33; text-align: center; margin-bottom: 20px; }
        .modal-options { display: flex; flex-direction: column; gap: 10px; }

        .modal-option {
            padding: 14px 18px;
            background: #f7f9fc;
            border: none;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 500;
            color: #0b1a33;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .modal-option:hover { background: #f1f3f7; transform: translateX(4px); }
        .modal-option .icon { font-size: 22px; }

        .modal-close {
            margin-top: 16px;
            padding: 14px;
            background: none;
            border: none;
            font-size: 14px;
            color: #8e9aaf;
            cursor: pointer;
            font-family: inherit;
            width: 100%;
            text-align: center;
        }
        .modal-close:hover { color: #0b1a33; }

        .input-modal .modal { padding-bottom: 40px; }
        .input-modal input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #e6eaf0;
            border-radius: 14px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            background: #fafbfc;
            transition: all 0.25s ease;
            margin-bottom: 16px;
        }
        .input-modal input:focus {
            border-color: #6c5ce7;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.06);
        }

        .input-modal .modal-actions { display: flex; gap: 10px; }
        .input-modal .modal-actions button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s ease;
        }
        .input-modal .modal-actions .btn-confirm { background: #6c5ce7; color: #fff; }
        .input-modal .modal-actions .btn-confirm:hover { background: #5a4bd1; }
        .input-modal .modal-actions .btn-cancel { background: #f1f3f7; color: #8e9aaf; }
        .input-modal .modal-actions .btn-cancel:hover { background: #e6eaf0; }

        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUpModal {
            0% { transform: translateY(40px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        @media (max-width: 420px) {
            .app-wrapper { height: 100vh; max-height: 100vh; border-radius: 0; padding: 0; }
            .page { padding: 18px 14px 90px; }
            .bottom-nav { padding: 0 12px 6px; }
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <div class="pages-container" id="pagesContainer">

            <!-- СТРАНИЦА 1: ВСЕ ЗАПИСИ (слева) -->
            <div class="page page-all" id="pageAll">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                    <span class="page-title">📚 Все записи</span>
                    <button onclick="goToMain()" style="background:none; border:none; font-size:20px; cursor:pointer; color:#8e9aaf;">✕</button>
                </div>
                <div id="allItemsList"><div class="empty-state">Нет записей</div></div>
            </div>

            <!-- СТРАНИЦА 2: ГЛАВНАЯ (центр) -->
            <div class="page page-main" id="pageMain">
                <div class="greeting" id="greeting">Доброе утро 👋</div>
                <div class="greeting-sub" id="greetingSub">Вот что у вас сегодня</div>

                <div class="calendar-mini">
                    <div class="calendar-mini-header">
                        <button id="calMiniPrev">◀</button>
                        <span class="month" id="calMiniMonth">Январь 2026</span>
                        <button id="calMiniNext">▶</button>
                    </div>
                    <div class="calendar-mini-weekdays">
                        <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
                    </div>
                    <div class="calendar-mini-days" id="calMiniDays"></div>
                </div>

                <div class="week-section">
                    <div class="week-header">
                        <span class="week-title">📅 This week</span>
                        <span class="week-stats">Выполнено: <span id="weekDoneCount">0</span>/<span id="weekTotalCount">0</span></span>
                    </div>
                    <ul class="week-list" id="weekList">
                        <li class="week-item empty" style="justify-content:center; color:#b8c4d6;">Нет задач на эту неделю</li>
                    </ul>
                </div>

                <div class="notes-grid" id="notesGrid">
                    <div class="note-card" style="grid-column: span 2; text-align:center; color:#b8c4d6; justify-content:center; min-height:60px;">
                        Нет заметок
                    </div>
                </div>
            </div>

            <!-- СТРАНИЦА 3: СПИСОК ЗАДАЧ (справа) -->
            <div class="page page-tasks" id="pageTasks">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                    <span class="page-title">📋 Задачи</span>
                    <button onclick="goToMain()" style="background:none; border:none; font-size:20px; cursor:pointer; color:#8e9aaf;">✕</button>
                </div>
                <div id="allTasksList"><div class="empty-state">Нет задач</div></div>
            </div>
        </div>

        <!-- ===== НИЖНЯЯ ПАНЕЛЬ (3 КНОПКИ) ===== -->
        <div class="bottom-nav">
            <button class="nav-btn" id="navAll" onclick="goToAll()">
                📚
                <span class="label">Все</span>
                <span class="badge hidden" id="allBadge">0</span>
            </button>
            <button class="nav-btn active" id="navAdd" onclick="openAddModal()">
                ➕
                <span class="label">Добавить</span>
            </button>
            <button class="nav-btn" id="navTasks" onclick="goToTasks()">
                📋
                <span class="label">Задачи</span>
                <span class="badge hidden" id="taskBadge">0</span>
            </button>
        </div>
    </div>

    <!-- ===== ВСПЛЫВАЮЩИЕ ОКНА ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-title">➕ Что хотите добавить?</div>
            <div class="modal-options">
                <button class="modal-option" data-type="task"><span class="icon">📋</span> Задача</button>
                <button class="modal-option" data-type="event"><span class="icon">📅</span> Событие в календарь</button>
                <button class="modal-option" data-type="note"><span class="icon">📝</span> Заметка</button>
            </div>
            <button class="modal-close" id="modalClose">Закрыть</button>
        </div>
    </div>

    <div class="modal-overlay input-modal" id="inputModal">
        <div class="modal">
            <div class="modal-title" id="inputModalTitle">Добавить задачу</div>
            <input type="text" id="inputModalField" placeholder="Введите текст..." />
            <div class="modal-actions">
                <button class="btn-cancel" id="inputModalCancel">Отмена</button>
                <button class="btn-confirm" id="inputModalConfirm">Добавить</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. ПОЛУЧЕНИЕ USER_ID ИЗ URL (от бота)
        // ============================================================
        const urlParams = new URLSearchParams(window.location.search);
        let userId = urlParams.get('user_id');

        if (!userId) {
            userId = localStorage.getItem('tasky_user_id');
            if (!userId) {
                userId = 'temp_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
                localStorage.setItem('tasky_user_id', userId);
            }
        } else {
            localStorage.setItem('tasky_user_id', userId);
        }

        console.log('✅ Используется user_id:', userId);

        // ============================================================
        // 2. ИНИЦИАЛИЗАЦИЯ
        // ============================================================
        const API_URL = '/api/user';
        let currentData = { tasks: [], notes: [] };
        let currentModalType = 'task';
        let selectedDate = new Date();
        let currentPage = 'main';

        // ============================================================
        // 3. API
        // ============================================================
        async function fetchUserData() {
            try {
                const res = await fetch(`${API_URL}/${userId}`);
                if (!res.ok) throw new Error('Ошибка загрузки');
                return await res.json();
            } catch {
                return { tasks: [], notes: [] };
            }
        }

        async function saveUserData(data) {
            try {
                const res = await fetch(`${API_URL}/${userId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if (!res.ok) throw new Error('Ошибка сохранения');
                return await res.json();
            } catch {
                alert('Не удалось сохранить данные. Проверьте соединение.');
            }
        }

        // ============================================================
        // 4. НАВИГАЦИЯ (исправлены свайпы)
        // ============================================================
        function goToMain() {
            currentPage = 'main';
            document.getElementById('pagesContainer').style.transform = 'translateX(-33.333%)';
            updateNavButtons('main');
        }

        function goToTasks() {
            currentPage = 'tasks';
            document.getElementById('pagesContainer').style.transform = 'translateX(-66.666%)';
            updateNavButtons('tasks');
            renderAllTasks();
        }

        function goToAll() {
            currentPage = 'all';
            document.getElementById('pagesContainer').style.transform = 'translateX(0%)';
            updateNavButtons('all');
            renderAllItems();
        }

        function updateNavButtons(active) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            if (active === 'main') document.getElementById('navAdd').classList.add('active');
            else if (active === 'tasks') document.getElementById('navTasks').classList.add('active');
            else if (active === 'all') document.getElementById('navAll').classList.add('active');
        }

        // ============================================================
        // 5. ПРИВЕТСТВИЕ
        // ============================================================
        function setGreeting() {
            const hour = new Date().getHours();
            let greeting = '',
                sub = '';
            if (hour < 6) { greeting = 'Доброй ночи 🌙';
                sub = 'Уже поздно, но вы всё ещё здесь'; } else if (hour < 12) { greeting = 'Доброе утро ☀️';
                sub = 'Начните день с планирования!'; } else if (hour < 18) { greeting = 'Добрый день 🌤️';
                sub = 'Продолжайте двигаться к целям'; } else { greeting = 'Добрый вечер 🌆';
                sub = 'Время подвести итоги дня'; }
            document.getElementById('greeting').textContent = greeting;
            document.getElementById('greetingSub').textContent = sub;
        }

        // ============================================================
        // 6. УТИЛИТЫ
        // ============================================================
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(date) {
            const d = String(date.getDate()).padStart(2, '0');
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const y = date.getFullYear();
            return `${d}.${m}.${y}`;
        }

        function isTaskInWeek(task) {
            const now = new Date();
            const startOfWeek = new Date(now);
            startOfWeek.setDate(now.getDate() - now.getDay() + 1);
            startOfWeek.setHours(0, 0, 0, 0);
            const endOfWeek = new Date(startOfWeek);
            endOfWeek.setDate(startOfWeek.getDate() + 6);
            endOfWeek.setHours(23, 59, 59, 999);

            const match = task.text.match(/(\d{2}\.\d{2}\.\d{4})/);
            if (match) {
                const parts = match[1].split('.');
                const d = new Date(parts[2], parts[1] - 1, parts[0]);
                return d >= startOfWeek && d <= endOfWeek;
            }
            return false;
        }

        // ============================================================
        // 7. РЕНДЕРИНГ ГЛАВНОЙ
        // ============================================================
        function renderCalendarMini() {
            const monthNames = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
            const year = selectedDate.getFullYear();
            const month = selectedDate.getMonth();
            document.getElementById('calMiniMonth').textContent = `${monthNames[month]} ${year}`;

            const firstDay = new Date(year, month, 1);
            const startDay = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1;
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const today = new Date();

            const tasks = currentData.tasks || [];

            let html = '';
            for (let i = 0; i < startDay; i++) html += '<div class="calendar-mini-day empty"></div>';
            for (let day = 1; day <= daysInMonth; day++) {
                const dateObj = new Date(year, month, day);
                const isToday = today.toDateString() === dateObj.toDateString();
                const dateStr = formatDate(dateObj);
                const hasEvent = tasks.some(t => t.text.includes(dateStr) && !t.done);

                let classes = 'calendar-mini-day';
                if (isToday) classes += ' today';
                if (hasEvent) classes += ' has-event';

                html += `<div class="${classes}" data-date="${dateObj.toISOString()}">${day}</div>`;
            }
            document.getElementById('calMiniDays').innerHTML = html;

            document.querySelectorAll('.calendar-mini-day:not(.empty)').forEach(el => {
                el.addEventListener('click', function() {
                    const date = new Date(this.dataset.date);
                    selectedDate = date;
                    openEventAddModal(date);
                });
            });
        }

        function renderWeekTasks() {
            const list = document.getElementById('weekList');
            const tasks = currentData.tasks || [];

            const weekTasks = tasks.filter(t => isTaskInWeek(t));
            const done = weekTasks.filter(t => t.done).length;

            document.getElementById('weekDoneCount').textContent = done;
            document.getElementById('weekTotalCount').textContent = weekTasks.length;

            if (weekTasks.length === 0) {
                list.innerHTML =
                    '<li class="week-item empty" style="justify-content:center; color:#b8c4d6;">Нет задач на эту неделю</li>';
                return;
            }

            list.innerHTML = weekTasks.map((task, i) => `
                <li class="week-item ${task.done ? 'done' : ''}" data-index="${i}">
                    <div class="week-item-check ${task.done ? 'done' : ''}" data-index="${i}">
                        ${task.done ? '✓' : ''}
                    </div>
                    <span class="week-item-text">${escapeHtml(task.text)}</span>
                    <button class="week-item-delete" data-index="${i}">🗑️</button>
                </li>
            `).join('');

            list.querySelectorAll('.week-item-check').forEach(el => {
                el.addEventListener('click', async function() {
                    const idx = parseInt(this.dataset.index);
                    const tasks = currentData.tasks || [];
                    const weekTasks = tasks.filter(t => isTaskInWeek(t));
                    if (weekTasks[idx]) {
                        const taskText = weekTasks[idx].text;
                        const allTasks = tasks.map(t => {
                            if (t.text === taskText) return { ...t, done: !t.done };
                            return t;
                        });
                        await saveUserData({ ...currentData, tasks: allTasks });
                        await refreshData();
                    }
                });
            });

            list.querySelectorAll('.week-item-delete').forEach(el => {
                el.addEventListener('click', async function() {
                    const idx = parseInt(this.dataset.index);
                    const tasks = currentData.tasks || [];
                    const weekTasks = tasks.filter(t => isTaskInWeek(t));
                    if (weekTasks[idx]) {
                        const taskText = weekTasks[idx].text;
                        const allTasks = tasks.filter(t => t.text !== taskText);
                        await saveUserData({ ...currentData, tasks: allTasks });
                        await refreshData();
                    }
                });
            });
        }

        function renderNotes() {
            const grid = document.getElementById('notesGrid');
            const notes = currentData.notes || [];

            if (notes.length === 0) {
                grid.innerHTML =
                    `<div class="note-card" style="grid-column: span 2; text-align:center; color:#b8c4d6; justify-content:center; min-height:60px;">Нет заметок</div>`;
                return;
            }

            grid.innerHTML = notes.map((note, i) => `
                <div class="note-card" data-index="${i}">
                    <div class="note-card-text">${escapeHtml(note.text)}</div>
                    <div class="note-card-footer">
                        <span class="note-card-date">${note.date || ''}</span>
                        <button class="note-card-delete" data-index="${i}">🗑️</button>
                    </div>
                </div>
            `).join('');

            grid.querySelectorAll('.note-card-delete').forEach(el => {
                el.addEventListener('click', async function() {
                    const idx = parseInt(this.dataset.index);
                    const notes = currentData.notes || [];
                    notes.splice(idx, 1);
                    await saveUserData({ ...currentData, notes });
                    await refreshData();
                });
            });
        }

        // ============================================================
        // 8. РЕНДЕРИНГ СТРАНИЦЫ ЗАДАЧ
        // ============================================================
        function renderAllTasks() {
            const container = document.getElementById('allTasksList');
            const tasks = currentData.tasks || [];

            if (tasks.length === 0) {
                container.innerHTML = '<div class="empty-state">Нет задач</div>';
                document.getElementById('taskBadge').textContent = '0';
                document.getElementById('taskBadge').classList.add('hidden');
                return;
            }

            document.getElementById('taskBadge').textContent = tasks.length;
            document.getElementById('taskBadge').classList.remove('hidden');

            container.innerHTML = tasks.map((task, i) => `
                <div class="task-item ${task.done ? 'done' : ''}" data-index="${i}">
                    <div class="task-check ${task.done ? 'done' : ''}" data-index="${i}">
                        ${task.done ? '✓' : ''}
                    </div>
                    <span class="task-text">${escapeHtml(task.text)}</span>
                    <button class="task-delete" data-index="${i}">🗑️</button>
                </div>
            `).join('');

            container.querySelectorAll('.task-check').forEach(el => {
                el.addEventListener('click', async function() {
                    const idx = parseInt(this.dataset.index);
                    const tasks = currentData.tasks || [];
                    if (tasks[idx]) {
                        tasks[idx].done = !tasks[idx].done;
                        await saveUserData({ ...currentData, tasks });
                        await refreshData();
                    }
                });
            });

            container.querySelectorAll('.task-delete').forEach(el => {
                el.addEventListener('click', async function() {
                    const idx = parseInt(this.dataset.index);
                    const tasks = currentData.tasks || [];
                    tasks.splice(idx, 1);
                    await saveUserData({ ...currentData, tasks });
                    await refreshData();
                });
            });
        }

        // ============================================================
        // 9. РЕНДЕРИНГ СТРАНИЦЫ "ВСЕ ЗАПИСИ"
        // ============================================================
        function renderAllItems() {
            const container = document.getElementById('allItemsList');
            const tasks = currentData.tasks || [];
            const notes = currentData.notes || [];

            let items = [];

            tasks.forEach(t => {
                const isEvent = t.text.match(/\d{2}\.\d{2}\.\d{4}/);
                items.push({
                    text: t.text,
                    type: isEvent ? 'event' : 'task',
                    done: t.done || false,
                    isTask: true
                });
            });

            notes.forEach(n => {
                items.push({
                    text: n.text,
                    type: 'note',
                    done: false,
                    isTask: false,
                    date: n.date || ''
                });
            });

            if (items.length === 0) {
                container.innerHTML = '<div class="empty-state">Нет записей</div>';
                document.getElementById('allBadge').textContent = '0';
                document.getElementById('allBadge').classList.add('hidden');
                return;
            }

            document.getElementById('allBadge').textContent = items.length;
            document.getElementById('allBadge').classList.remove('hidden');

            const typeLabels = { task: 'Задача', event: 'Событие', note: 'Заметка' };
            const typeClasses = { task: 'task', event: 'event', note: 'note' };

            container.innerHTML = items.map((item, i) => `
                <div class="all-item" data-index="${i}">
                    <span class="type-badge ${typeClasses[item.type]}">${typeLabels[item.type]}</span>
                    <span class="all-text">${escapeHtml(item.text)}${item.done ? ' ✅' : ''}</span>
                    <button class="all-delete" data-index="${i}" data-type="${item.type}" data-text="${escapeHtml(item.text)}">🗑️</button>
                </div>
            `).join('');

            container.querySelectorAll('.all-delete').forEach(el => {
                el.addEventListener('click', async function() {
                    const text = this.dataset.text;
                    const type = this.dataset.type;

                    if (type === 'note') {
                        const notes = currentData.notes || [];
                        const filtered = notes.filter(n => n.text !== text);
                        await saveUserData({ ...currentData, notes: filtered });
                    } else {
                        const tasks = currentData.tasks || [];
                        const filtered = tasks.filter(t => t.text !== text);
                        await saveUserData({ ...currentData, tasks: filtered });
                    }
                    await refreshData();
                });
            });
        }

        // ============================================================
        // 10. ВСПЛЫВАЮЩИЕ ОКНА
        // ============================================================
        function openAddModal() {
            if (currentPage === 'main') {
                document.getElementById('modalOverlay').classList.add('active');
            } else {
                goToMain();
                setTimeout(() => {
                    document.getElementById('modalOverlay').classList.add('active');
                }, 400);
            }
        }

        function openEventAddModal(date) {
            const dateStr = formatDate(date);
            currentModalType = 'event';
            document.getElementById('inputModalTitle').textContent = `Добавить событие на ${dateStr}`;
            document.getElementById('inputModalField').placeholder = `Событие на ${dateStr}...`;
            document.getElementById('inputModalField').value = '';
            document.getElementById('inputModal').classList.add('active');
            setTimeout(() => document.getElementById('inputModalField').focus(), 300);
            document.getElementById('inputModalConfirm').dataset.date = dateStr;
        }

        document.getElementById('modalClose').addEventListener('click', () => {
            document.getElementById('modalOverlay').classList.remove('active');
        });

        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) {
                document.getElementById('modalOverlay').classList.remove('active');
            }
        });

        document.querySelectorAll('.modal-option').forEach(btn => {
            btn.addEventListener('click', function() {
                const type = this.dataset.type;
                currentModalType = type;
                document.getElementById('modalOverlay').classList.remove('active');

                let title = 'Добавить задачу';
                let placeholder = 'Введите текст задачи...';
                if (type === 'event') {
                    title = 'Добавить событие в календарь';
                    placeholder = 'Введите событие...';
                } else if (type === 'note') {
                    title = 'Добавить заметку';
                    placeholder = 'Введите текст заметки...';
                }

                document.getElementById('inputModalTitle').textContent = title;
                document.getElementById('inputModalField').placeholder = placeholder;
                document.getElementById('inputModalField').value = '';
                document.getElementById('inputModal').classList.add('active');
                setTimeout(() => document.getElementById('inputModalField').focus(), 300);
            });
        });

        document.getElementById('inputModalCancel').addEventListener('click', () => {
            document.getElementById('inputModal').classList.remove('active');
        });

        document.getElementById('inputModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) {
                document.getElementById('inputModal').classList.remove('active');
            }
        });

        document.getElementById('inputModalConfirm').addEventListener('click', async function() {
            const text = document.getElementById('inputModalField').value.trim();
            if (!text) return;

            const tasks = currentData.tasks || [];
            const notes = currentData.notes || [];

            const dateFromCalendar = this.dataset.date;

            if (currentModalType === 'task') {
                tasks.push({ text, done: false });
                await saveUserData({ ...currentData, tasks });
            } else if (currentModalType === 'event') {
                const dateStr = dateFromCalendar || formatDate(new Date());
                tasks.push({ text: `${text} (${dateStr})`, done: false });
                await saveUserData({ ...currentData, tasks });
            } else if (currentModalType === 'note') {
                notes.push({ text, date: new Date().toLocaleString() });
                await saveUserData({ ...currentData, notes });
            }

            this.dataset.date = '';
            document.getElementById('inputModal').classList.remove('active');
            await refreshData();
        });

        document.getElementById('inputModalField').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('inputModalConfirm').click();
            }
        });

        // ============================================================
        // 11. НАВИГАЦИЯ ПО КАЛЕНДАРЮ
        // ============================================================
        document.getElementById('calMiniPrev').addEventListener('click', () => {
            selectedDate.setMonth(selectedDate.getMonth() - 1);
            renderCalendarMini();
        });

        document.getElementById('calMiniNext').addEventListener('click', () => {
            selectedDate.setMonth(selectedDate.getMonth() + 1);
            renderCalendarMini();
        });

        // ============================================================
        // 12. ОБНОВЛЕНИЕ ДАННЫХ
        // ============================================================
        async function refreshData() {
            const data = await fetchUserData();
            currentData = data;
            setGreeting();
            renderCalendarMini();
            renderWeekTasks();
            renderNotes();

            if (currentPage === 'tasks') renderAllTasks();
            if (currentPage === 'all') renderAllItems();

            const taskCount = (currentData.tasks || []).length;
            document.getElementById('taskBadge').textContent = taskCount;
            if (taskCount > 0) document.getElementById('taskBadge').classList.remove('hidden');
            else document.getElementById('taskBadge').classList.add('hidden');

            const allCount = (currentData.tasks || []).length + (currentData.notes || []).length;
            document.getElementById('allBadge').textContent = allCount;
            if (allCount > 0) document.getElementById('allBadge').classList.remove('hidden');
            else document.getElementById('allBadge').classList.add('hidden');
        }

        // ============================================================
        // 13. ЗАПУСК
        // ============================================================
        refreshData();

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) refreshData();
        });

        console.log('✅ Tasky запущен, user_id:', userId);
    </script>

</body>
</html>
