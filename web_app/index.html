<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Tasky</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px 16px 40px;
        }

        .app {
            max-width: 400px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            padding: 24px 20px 28px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: scale(0.96); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* ===== ВЕРХНЯЯ СТРОКА (без аватарки) ===== */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .app-title {
            font-size: 20px;
            font-weight: 700;
            color: #0b1a33;
            letter-spacing: -0.3px;
        }

        .app-title span {
            color: #6c5ce7;
        }

        .logout-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #8e9aaf;
            padding: 4px 8px;
            border-radius: 12px;
            transition: all 0.2s ease;
        }

        .logout-btn:hover {
            background: #f1f3f7;
            transform: scale(1.05);
        }

        .logout-btn:active {
            transform: scale(0.92);
        }

        /* ===== СТАТИСТИКА (как на фото) ===== */
        .stats {
            display: flex;
            gap: 10px;
            margin-bottom: 28px;
        }

        .stat-card {
            flex: 1;
            background: #f7f9fc;
            border-radius: 18px;
            padding: 14px 0;
            text-align: center;
            transition: all 0.25s ease;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 16px rgba(108, 92, 231, 0.06);
        }

        .stat-number {
            font-size: 22px;
            font-weight: 700;
            color: #0b1a33;
            display: block;
            line-height: 1.2;
        }

        .stat-label {
            font-size: 12px;
            color: #8e9aaf;
            display: block;
            margin-top: 4px;
        }

        /* ===== ВКЛАДКИ ===== */
        .tabs {
            display: flex;
            gap: 8px;
            background: #f1f3f7;
            border-radius: 16px;
            padding: 4px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 0;
            border: none;
            background: transparent;
            border-radius: 13px;
            font-size: 14px;
            font-weight: 500;
            color: #8e9aaf;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .tab-btn.active {
            background: #ffffff;
            color: #0b1a33;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .tab-btn:active {
            transform: scale(0.96);
        }

        .tab-btn .badge {
            display: inline-block;
            background: #6c5ce7;
            color: #fff;
            font-size: 10px;
            font-weight: 600;
            padding: 1px 8px;
            border-radius: 12px;
            margin-left: 4px;
            transition: all 0.3s ease;
        }

        .tab-btn .badge.hidden {
            opacity: 0;
            transform: scale(0.8);
        }

        /* ===== КОНТЕНТ ===== */
        .tab-content {
            display: none;
            animation: slideUp 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(6px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* ===== ФОРМА ДОБАВЛЕНИЯ ===== */
        .add-form {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .add-form input {
            flex: 1;
            padding: 12px 14px;
            border: 1px solid #e6eaf0;
            border-radius: 14px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            background: #fafbfc;
            transition: all 0.25s ease;
        }

        .add-form input:focus {
            border-color: #6c5ce7;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.06);
        }

        .add-form input::placeholder {
            color: #b8c4d6;
        }

        .add-btn {
            padding: 10px 16px;
            background: #6c5ce7;
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 48px;
        }

        .add-btn:hover {
            background: #5a4bd1;
            transform: scale(1.02);
        }

        .add-btn:active {
            transform: scale(0.94);
        }

        /* ===== СПИСОК ===== */
        .items-list {
            list-style: none;
            padding: 0;
        }

        .item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            background: #f7f9fc;
            border-radius: 14px;
            margin-bottom: 8px;
            transition: all 0.25s ease;
            animation: itemFade 0.3s ease;
        }

        @keyframes itemFade {
            0% { opacity: 0; transform: translateX(-8px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        .item:hover {
            background: #f1f3f7;
            transform: translateX(2px);
        }

        .item.done .item-text {
            text-decoration: line-through;
            color: #aab4c6;
        }

        .item-text {
            flex: 1;
            font-size: 14px;
            color: #0b1a33;
            word-break: break-word;
        }

        .item-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
            margin-left: 8px;
        }

        .item-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .item-btn:hover {
            background: rgba(0, 0, 0, 0.04);
            transform: scale(1.1);
        }

        .item-btn:active {
            transform: scale(0.85);
        }

        .empty {
            text-align: center;
            color: #b8c4d6;
            font-size: 14px;
            padding: 24px 0;
        }

        /* ===== КАЛЕНДАРЬ ===== */
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .calendar-header button {
            background: none;
            border: 1px solid #e6eaf0;
            border-radius: 10px;
            padding: 6px 14px;
            font-size: 16px;
            cursor: pointer;
            color: #0b1a33;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .calendar-header button:hover {
            background: #f1f3f7;
            transform: scale(1.03);
        }

        .calendar-header button:active {
            transform: scale(0.92);
        }

        .calendar-month {
            font-weight: 600;
            font-size: 15px;
            color: #0b1a33;
        }

        .calendar-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 12px;
            font-weight: 500;
            color: #8e9aaf;
            margin-bottom: 8px;
        }

        .calendar-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.25s ease;
            background: transparent;
            color: #0b1a33;
            position: relative;
        }

        .calendar-day:hover {
            background: #f1f3f7;
            transform: scale(1.05);
        }

        .calendar-day:active {
            transform: scale(0.92);
        }

        .calendar-day.today {
            background: #6c5ce7;
            color: #fff;
            font-weight: 600;
        }

        .calendar-day.today:hover {
            background: #5a4bd1;
        }

        .calendar-day.selected {
            border: 2px solid #6c5ce7;
        }

        .calendar-day.has-event::after {
            content: '';
            position: absolute;
            bottom: 4px;
            width: 5px;
            height: 5px;
            background: #6c5ce7;
            border-radius: 50%;
        }

        .calendar-day.empty {
            cursor: default;
            background: transparent !important;
            transform: none !important;
        }

        .calendar-day.empty:hover {
            transform: none !important;
        }

        /* ===== СОБЫТИЯ В КАЛЕНДАРЕ ===== */
        .calendar-events {
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid #e6eaf0;
        }

        .calendar-events-title {
            font-size: 13px;
            font-weight: 500;
            color: #8e9aaf;
            margin-bottom: 10px;
        }

        .calendar-events-list {
            list-style: none;
            padding: 0;
        }

        .calendar-event {
            padding: 8px 14px;
            background: #f7f9fc;
            border-radius: 10px;
            margin-bottom: 6px;
            font-size: 14px;
            color: #0b1a33;
            transition: all 0.25s ease;
            animation: itemFade 0.3s ease;
        }

        .calendar-event:hover {
            background: #f1f3f7;
            transform: translateX(2px);
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 420px) {
            .app {
                padding: 18px 14px 22px;
            }
            .stat-number {
                font-size: 18px;
            }
            .tab-btn {
                font-size: 13px;
                padding: 8px 0;
            }
            .app-title {
                font-size: 17px;
            }
        }
    </style>
</head>
<body>

    <div class="app">
        <!-- ===== ВЕРХНЯЯ СТРОКА ===== -->
        <div class="top-bar">
            <div class="top-bar-left">
                <div class="app-title">Tasky<span>.</span></div>
            </div>
            <button class="logout-btn" id="logoutBtn" title="Выйти">🚪</button>
        </div>

        <!-- ===== СТАТИСТИКА ===== -->
        <div class="stats">
            <div class="stat-card">
                <span class="stat-number" id="taskCount">0</span>
                <span class="stat-label">📋 Задач</span>
            </div>
            <div class="stat-card">
                <span class="stat-number" id="noteCount">0</span>
                <span class="stat-label">📝 Заметок</span>
            </div>
            <div class="stat-card">
                <span class="stat-number" id="weekTasks">0</span>
                <span class="stat-label">📅 На неделю</span>
            </div>
        </div>

        <!-- ===== ВКЛАДКИ ===== -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="tasks">
                📋 <span class="badge hidden" id="taskBadge">0</span>
            </button>
            <button class="tab-btn" data-tab="notes">
                📝 <span class="badge hidden" id="noteBadge">0</span>
            </button>
            <button class="tab-btn" data-tab="calendar">📅</button>
        </div>

        <!-- ===== ВКЛАДКА: ЗАДАЧИ ===== -->
        <div class="tab-content active" id="tab-tasks">
            <div class="add-form">
                <input type="text" id="taskInput" placeholder="Новая задача..." />
                <button id="addTaskBtn" class="add-btn">+</button>
            </div>
            <ul class="items-list" id="tasksList">
                <li class="empty">Нет задач</li>
            </ul>
        </div>

        <!-- ===== ВКЛАДКА: ЗАМЕТКИ ===== -->
        <div class="tab-content" id="tab-notes">
            <div class="add-form">
                <input type="text" id="noteInput" placeholder="Новая заметка..." />
                <button id="addNoteBtn" class="add-btn">+</button>
            </div>
            <ul class="items-list" id="notesList">
                <li class="empty">Нет заметок</li>
            </ul>
        </div>

        <!-- ===== ВКЛАДКА: КАЛЕНДАРЬ ===== -->
        <div class="tab-content" id="tab-calendar">
            <div class="calendar-header">
                <button id="calendarPrev">◀</button>
                <span class="calendar-month" id="calendarMonth">Январь 2026</span>
                <button id="calendarNext">▶</button>
            </div>
            <div class="calendar-weekdays">
                <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
            </div>
            <div class="calendar-days" id="calendarDays"></div>
            <div class="calendar-events" id="calendarEvents">
                <div class="calendar-events-title">📌 События на этот день</div>
                <ul class="calendar-events-list" id="calendarEventsList">
                    <li class="empty">Нет событий</li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. ИНИЦИАЛИЗАЦИЯ
        // ============================================================
        const API_URL = '/api/user';

        let userId = localStorage.getItem('tasky_user_id');
        if (!userId) {
            userId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
            localStorage.setItem('tasky_user_id', userId);
        }

        let currentData = { tasks: [], notes: [] };

        // ============================================================
        // 2. API
        // ============================================================
        async function fetchUserData() {
            try {
                const res = await fetch(`${API_URL}/${userId}`);
                if (!res.ok) throw new Error('Ошибка загрузки');
                return await res.json();
            } catch {
                return { tasks: [], notes: [] };
            }
        }

        async function saveUserData(data) {
            try {
                const res = await fetch(`${API_URL}/${userId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if (!res.ok) throw new Error('Ошибка сохранения');
                return await res.json();
            } catch {
                alert('Не удалось сохранить данные. Проверьте соединение.');
            }
        }

        // ============================================================
        // 3. РЕНДЕРИНГ
        // ============================================================
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function renderTasks(tasks) {
            const list = document.getElementById('tasksList');
            if (!tasks || tasks.length === 0) {
                list.innerHTML = '<li class="empty">Нет задач</li>';
                document.getElementById('taskCount').textContent = '0';
                document.getElementById('taskBadge').textContent = '0';
                document.getElementById('taskBadge').classList.add('hidden');
                return;
            }
            list.innerHTML = tasks.map((task, i) => `
                <li class="item ${task.done ? 'done' : ''}" data-index="${i}">
                    <span class="item-text">${escapeHtml(task.text)}</span>
                    <div class="item-actions">
                        ${!task.done ? `<button class="item-btn done-btn" data-index="${i}">✅</button>` : ''}
                        <button class="item-btn delete-btn" data-index="${i}">🗑️</button>
                    </div>
                </li>
            `).join('');
            const count = tasks.length;
            document.getElementById('taskCount').textContent = count;
            document.getElementById('taskBadge').textContent = count;
            document.getElementById('taskBadge').classList.remove('hidden');
            updateWeekTasks();
        }

        function renderNotes(notes) {
            const list = document.getElementById('notesList');
            if (!notes || notes.length === 0) {
                list.innerHTML = '<li class="empty">Нет заметок</li>';
                document.getElementById('noteCount').textContent = '0';
                document.getElementById('noteBadge').textContent = '0';
                document.getElementById('noteBadge').classList.add('hidden');
                return;
            }
            list.innerHTML = notes.map((note, i) => `
                <li class="item" data-index="${i}">
                    <span class="item-text">${escapeHtml(note.text)}</span>
                    <div class="item-actions">
                        ${note.date ? `<span style="font-size:11px;color:#8e9aaf;margin-right:6px;">📅 ${escapeHtml(note.date)}</span>` : ''}
                        <button class="item-btn delete-btn" data-index="${i}">🗑️</button>
                    </div>
                </li>
            `).join('');
            const count = notes.length;
            document.getElementById('noteCount').textContent = count;
            document.getElementById('noteBadge').textContent = count;
            document.getElementById('noteBadge').classList.remove('hidden');
        }

        function updateWeekTasks() {
            const tasks = currentData.tasks || [];
            const now = new Date();
            const startOfWeek = new Date(now);
            startOfWeek.setDate(now.getDate() - now.getDay() + 1);
            startOfWeek.setHours(0, 0, 0, 0);
            const endOfWeek = new Date(startOfWeek);
            endOfWeek.setDate(startOfWeek.getDate() + 6);
            endOfWeek.setHours(23, 59, 59, 999);

            const weekTasks = tasks.filter(t => {
                if (t.done) return false;
                const match = t.text.match(/(\d{2}\.\d{2}\.\d{4})/);
                if (match) {
                    const parts = match[1].split('.');
                    const date = new Date(parts[2], parts[1] - 1, parts[0]);
                    return date >= startOfWeek && date <= endOfWeek;
                }
                return false;
            });
            document.getElementById('weekTasks').textContent = weekTasks.length;
        }

        async function refreshData() {
            const data = await fetchUserData();
            currentData = data;
            renderTasks(data.tasks || []);
            renderNotes(data.notes || []);
            renderCalendar();
        }

        // ============================================================
        // 4. ДОБАВЛЕНИЕ / УДАЛЕНИЕ
        // ============================================================
        document.getElementById('addTaskBtn').addEventListener('click', async () => {
            const input = document.getElementById('taskInput');
            const text = input.value.trim();
            if (!text) return;
            const tasks = [...(currentData.tasks || []), { text, done: false }];
            await saveUserData({ ...currentData, tasks });
            input.value = '';
            await refreshData();
        });

        document.getElementById('addNoteBtn').addEventListener('click', async () => {
            const input = document.getElementById('noteInput');
            const text = input.value.trim();
            if (!text) return;
            const notes = [...(currentData.notes || []), { text, date: new Date().toLocaleString() }];
            await saveUserData({ ...currentData, notes });
            input.value = '';
            await refreshData();
        });

        document.getElementById('tasksList').addEventListener('click', async (e) => {
            const btn = e.target.closest('.item-btn');
            if (!btn) return;
            const index = parseInt(btn.dataset.index);
            if (isNaN(index)) return;
            const tasks = [...(currentData.tasks || [])];
            if (btn.classList.contains('delete-btn')) {
                tasks.splice(index, 1);
                await saveUserData({ ...currentData, tasks });
                await refreshData();
            } else if (btn.classList.contains('done-btn')) {
                tasks[index].done = true;
                await saveUserData({ ...currentData, tasks });
                await refreshData();
            }
        });

        document.getElementById('notesList').addEventListener('click', async (e) => {
            const btn = e.target.closest('.item-btn');
            if (!btn) return;
            const index = parseInt(btn.dataset.index);
            if (isNaN(index)) return;
            if (btn.classList.contains('delete-btn')) {
                const notes = [...(currentData.notes || [])];
                notes.splice(index, 1);
                await saveUserData({ ...currentData, notes });
                await refreshData();
            }
        });

        // ============================================================
        // 5. КАЛЕНДАРЬ
        // ============================================================
        let currentDate = new Date();
        let selectedDate = new Date();

        function renderCalendar() {
            const monthNames = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            document.getElementById('calendarMonth').textContent = `${monthNames[month]} ${year}`;

            const firstDay = new Date(year, month, 1);
            const startDay = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1;
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const today = new Date();

            let html = '';
            for (let i = 0; i < startDay; i++) html += '<div class="calendar-day empty"></div>';
            for (let day = 1; day <= daysInMonth; day++) {
                const dateObj = new Date(year, month, day);
                const isToday = today.toDateString() === dateObj.toDateString();
                const isSelected = selectedDate.toDateString() === dateObj.toDateString();
                const hasEvent = (currentData.tasks || []).some(t => {
                    if (t.done) return false;
                    const match = t.text.match(/(\d{2}\.\d{2}\.\d{4})/);
                    if (match) {
                        const parts = match[1].split('.');
                        const d = new Date(parts[2], parts[1] - 1, parts[0]);
                        return d.toDateString() === dateObj.toDateString();
                    }
                    return false;
                });
                html += `<div class="calendar-day ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''} ${hasEvent ? 'has-event' : ''}" data-date="${dateObj.toISOString()}">${day}</div>`;
            }
            document.getElementById('calendarDays').innerHTML = html;

            document.querySelectorAll('.calendar-day:not(.empty)').forEach(el => {
                el.addEventListener('click', function() {
                    selectedDate = new Date(this.dataset.date);
                    renderCalendar();
                    renderEventsForDate(selectedDate);
                });
            });
            renderEventsForDate(selectedDate);
        }

        function renderEventsForDate(date) {
            const list = document.getElementById('calendarEventsList');
            const tasks = (currentData.tasks || []).filter(t => {
                if (t.done) return false;
                const match = t.text.match(/(\d{2}\.\d{2}\.\d{4})/);
                if (match) {
                    const parts = match[1].split('.');
                    const d = new Date(parts[2], parts[1] - 1, parts[0]);
                    return d.toDateString() === date.toDateString();
                }
                return false;
            });
            if (tasks.length === 0) {
                list.innerHTML = '<li class="empty">Нет событий на этот день</li>';
            } else {
                list.innerHTML = tasks.map(t => `<li class="calendar-event">${escapeHtml(t.text)}</li>`).join('');
            }
        }

        document.getElementById('calendarPrev').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        });
        document.getElementById('calendarNext').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        });

        // ============================================================
        // 6. ВКЛАДКИ
        // ============================================================
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                this.classList.add('active');
                document.getElementById(`tab-${this.dataset.tab}`).classList.add('active');
                if (this.dataset.tab === 'calendar') renderCalendar();
            });
        });

        // ============================================================
        // 7. ВЫХОД
        // ============================================================
        document.getElementById('logoutBtn').addEventListener('click', () => {
            if (confirm('Вы уверены, что хотите выйти?')) {
                localStorage.removeItem('tasky_user_id');
                localStorage.removeItem('tasky_user_name');
                userId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
                localStorage.setItem('tasky_user_id', userId);
                refreshData();
            }
        });

        // ============================================================
        // 8. ЗАПУСК
        // ============================================================
        refreshData();

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) refreshData();
        });

        console.log('✅ Tasky запущен');
    </script>

</body>
</html>
