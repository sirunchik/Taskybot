<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Tasky</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 16px;
        }

        .app {
            max-width: 420px;
            width: 100%;
            background: #ffffff;
            border-radius: 32px;
            padding: 24px 20px 100px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
            position: relative;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: scale(0.96); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* ===== ПРИВЕТСТВИЕ ===== */
        .greeting {
            font-size: 22px;
            font-weight: 700;
            color: #0b1a33;
            margin-bottom: 4px;
        }

        .greeting-sub {
            font-size: 14px;
            color: #8e9aaf;
            margin-bottom: 24px;
        }

        /* ===== КАЛЕНДАРЬ (мини) ===== */
        .calendar-mini {
            background: #f7f9fc;
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 24px;
        }

        .calendar-mini-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .calendar-mini-header .month {
            font-weight: 600;
            font-size: 15px;
            color: #0b1a33;
        }

        .calendar-mini-header button {
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            color: #8e9aaf;
            padding: 4px 10px;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .calendar-mini-header button:hover {
            background: #e6eaf0;
        }

        .calendar-mini-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 11px;
            font-weight: 500;
            color: #8e9aaf;
            margin-bottom: 6px;
        }

        .calendar-mini-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .calendar-mini-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #0b1a33;
            position: relative;
        }

        .calendar-mini-day:hover {
            background: #e6eaf0;
        }

        .calendar-mini-day.today {
            background: #6c5ce7;
            color: #fff;
            font-weight: 600;
        }

        .calendar-mini-day.has-event {
            background: #6c5ce7;
            color: #fff;
        }

        .calendar-mini-day.empty {
            cursor: default;
        }

        .calendar-mini-day.empty:hover {
            background: transparent;
        }

        /* ===== THIS WEEK ===== */
        .week-section {
            margin-bottom: 24px;
        }

        .week-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .week-title {
            font-size: 16px;
            font-weight: 600;
            color: #0b1a33;
        }

        .week-stats {
            font-size: 13px;
            color: #8e9aaf;
        }

        .week-stats span {
            font-weight: 600;
            color: #0b1a33;
        }

        .week-list {
            list-style: none;
            padding: 0;
        }

        .week-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: #f7f9fc;
            border-radius: 14px;
            margin-bottom: 6px;
            transition: all 0.2s ease;
            animation: slideUp 0.3s ease;
        }

        .week-item.done {
            opacity: 0.5;
        }

        .week-item.done .week-item-text {
            text-decoration: line-through;
            color: #aab4c6;
        }

        .week-item-check {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid #d0d7e6;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s ease;
            font-size: 12px;
            background: #fff;
        }

        .week-item-check.done {
            background: #6c5ce7;
            border-color: #6c5ce7;
            color: #fff;
        }

        .week-item-text {
            flex: 1;
            font-size: 14px;
            color: #0b1a33;
        }

        .week-item-delete {
            background: none;
            border: none;
            color: #b8c4d6;
            cursor: pointer;
            font-size: 16px;
            transition: color 0.2s;
        }

        .week-item-delete:hover {
            color: #e74c3c;
        }

        /* ===== ЗАМЕТКИ (карточки) ===== */
        .notes-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 24px;
        }

        .note-card {
            background: #f7f9fc;
            border-radius: 16px;
            padding: 14px;
            transition: all 0.2s ease;
            animation: slideUp 0.3s ease;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .note-card:hover {
            background: #f1f3f7;
            transform: translateY(-2px);
        }

        .note-card-text {
            font-size: 13px;
            color: #0b1a33;
            word-break: break-word;
            margin-bottom: 8px;
        }

        .note-card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .note-card-date {
            font-size: 10px;
            color: #8e9aaf;
        }

        .note-card-delete {
            background: none;
            border: none;
            color: #b8c4d6;
            cursor: pointer;
            font-size: 14px;
            transition: color 0.2s;
        }

        .note-card-delete:hover {
            color: #e74c3c;
        }

        /* ===== СПИСОК ЗАДАЧ (кнопка-раздел) ===== */
        .tasks-section-btn {
            width: 100%;
            padding: 14px;
            background: #f7f9fc;
            border: none;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 500;
            color: #0b1a33;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .tasks-section-btn:hover {
            background: #f1f3f7;
            transform: translateY(-2px);
        }

        .tasks-section-btn .arrow {
            color: #8e9aaf;
            font-size: 18px;
        }

        /* ===== ВСПЛЫВАЮЩЕЕ ОКНО ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            z-index: 999;
            align-items: flex-end;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: #ffffff;
            border-radius: 28px 28px 0 0;
            padding: 24px 20px 32px;
            width: 100%;
            max-width: 420px;
            animation: slideUpModal 0.3s ease;
        }

        @keyframes slideUpModal {
            0% { transform: translateY(40px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
            color: #0b1a33;
            text-align: center;
            margin-bottom: 20px;
        }

        .modal-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .modal-option {
            padding: 14px 18px;
            background: #f7f9fc;
            border: none;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 500;
            color: #0b1a33;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .modal-option:hover {
            background: #f1f3f7;
            transform: translateX(4px);
        }

        .modal-option .icon {
            font-size: 22px;
        }

        .modal-close {
            margin-top: 16px;
            padding: 14px;
            background: none;
            border: none;
            font-size: 14px;
            color: #8e9aaf;
            cursor: pointer;
            font-family: inherit;
            width: 100%;
            text-align: center;
        }

        .modal-close:hover {
            color: #0b1a33;
        }

        /* ===== ПЛАВАЮЩАЯ КНОПКА ===== */
        .fab {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #6c5ce7;
            color: #fff;
            border: none;
            font-size: 30px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(108, 92, 231, 0.3);
            transition: all 0.3s ease;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fab:hover {
            transform: translateX(-50%) scale(1.05);
            box-shadow: 0 6px 28px rgba(108, 92, 231, 0.4);
        }

        .fab:active {
            transform: translateX(-50%) scale(0.92);
        }

        /* ===== ВСПЛЫВАЮЩЕЕ ПОЛЕ ВВОДА ===== */
        .input-modal .modal {
            padding-bottom: 40px;
        }

        .input-modal input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #e6eaf0;
            border-radius: 14px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            background: #fafbfc;
            transition: all 0.25s ease;
            margin-bottom: 16px;
        }

        .input-modal input:focus {
            border-color: #6c5ce7;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.06);
        }

        .input-modal .modal-actions {
            display: flex;
            gap: 10px;
        }

        .input-modal .modal-actions button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .input-modal .modal-actions .btn-confirm {
            background: #6c5ce7;
            color: #fff;
        }

        .input-modal .modal-actions .btn-confirm:hover {
            background: #5a4bd1;
        }

        .input-modal .modal-actions .btn-cancel {
            background: #f1f3f7;
            color: #8e9aaf;
        }

        .input-modal .modal-actions .btn-cancel:hover {
            background: #e6eaf0;
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 420px) {
            .app {
                padding: 18px 14px 100px;
            }
            .greeting {
                font-size: 19px;
            }
            .notes-grid {
                gap: 8px;
            }
            .note-card {
                padding: 12px;
                min-height: 70px;
            }
        }
    </style>
</head>
<body>

    <div class="app" id="app">
        <!-- ===== ПРИВЕТСТВИЕ ===== -->
        <div class="greeting" id="greeting">Доброе утро 👋</div>
        <div class="greeting-sub" id="greetingSub">Вот что у вас сегодня</div>

        <!-- ===== КАЛЕНДАРЬ (мини) ===== -->
        <div class="calendar-mini">
            <div class="calendar-mini-header">
                <button id="calMiniPrev">◀</button>
                <span class="month" id="calMiniMonth">Январь 2026</span>
                <button id="calMiniNext">▶</button>
            </div>
            <div class="calendar-mini-weekdays">
                <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
            </div>
            <div class="calendar-mini-days" id="calMiniDays"></div>
        </div>

        <!-- ===== THIS WEEK ===== -->
        <div class="week-section">
            <div class="week-header">
                <span class="week-title">📅 This week</span>
                <span class="week-stats">Выполнено: <span id="weekDoneCount">0</span>/<span id="weekTotalCount">0</span></span>
            </div>
            <ul class="week-list" id="weekList">
                <li class="week-item empty" style="justify-content:center; color:#b8c4d6;">Нет задач на эту неделю</li>
            </ul>
        </div>

        <!-- ===== ЗАМЕТКИ ===== -->
        <div class="notes-grid" id="notesGrid">
            <!-- Заметки рендерятся здесь -->
        </div>

        <!-- ===== КНОПКА "СПИСОК ЗАДАЧ" ===== -->
        <button class="tasks-section-btn" id="tasksSectionBtn">
            📋 Список задач
            <span class="arrow">→</span>
        </button>
    </div>

    <!-- ===== ПЛАВАЮЩАЯ КНОПКА ===== -->
    <button class="fab" id="fab">+</button>

    <!-- ===== ВСПЛЫВАЮЩЕЕ МЕНЮ ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-title">➕ Что хотите добавить?</div>
            <div class="modal-options">
                <button class="modal-option" data-type="task">
                    <span class="icon">📋</span> Задача
                </button>
                <button class="modal-option" data-type="event">
                    <span class="icon">📅</span> Событие в календарь
                </button>
                <button class="modal-option" data-type="note">
                    <span class="icon">📝</span> Заметка
                </button>
            </div>
            <button class="modal-close" id="modalClose">Закрыть</button>
        </div>
    </div>

    <!-- ===== ВСПЛЫВАЮЩЕЕ ПОЛЕ ДЛЯ ВВОДА ===== -->
    <div class="modal-overlay input-modal" id="inputModal">
        <div class="modal">
            <div class="modal-title" id="inputModalTitle">Добавить задачу</div>
            <input type="text" id="inputModalField" placeholder="Введите текст..." />
            <div class="modal-actions">
                <button class="btn-cancel" id="inputModalCancel">Отмена</button>
                <button class="btn-confirm" id="inputModalConfirm">Добавить</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. ИНИЦИАЛИЗАЦИЯ
        // ============================================================
        const API_URL = '/api/user';

        let userId = localStorage.getItem('tasky_user_id');
        if (!userId) {
            userId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
            localStorage.setItem('tasky_user_id', userId);
        }

        let currentData = { tasks: [], notes: [] };
        let currentModalType = 'task';
        let selectedDate = new Date();

        // ============================================================
        // 2. API
        // ============================================================
        async function fetchUserData() {
            try {
                const res = await fetch(`${API_URL}/${userId}`);
                if (!res.ok) throw new Error('Ошибка загрузки');
                return await res.json();
            } catch {
                return { tasks: [], notes: [] };
            }
        }

        async function saveUserData(data) {
            try {
                const res = await fetch(`${API_URL}/${userId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if (!res.ok) throw new Error('Ошибка сохранения');
                return await res.json();
            } catch {
                alert('Не удалось сохранить данные. Проверьте соединение.');
            }
        }

        // ============================================================
        // 3. ПРИВЕТСТВИЕ
        // ============================================================
        function setGreeting() {
            const hour = new Date().getHours();
            let greeting = '';
            let sub = '';

            if (hour < 6) {
                greeting = 'Доброй ночи 🌙';
                sub = 'Уже поздно, но вы всё ещё здесь';
            } else if (hour < 12) {
                greeting = 'Доброе утро ☀️';
                sub = 'Начните день с планирования!';
            } else if (hour < 18) {
                greeting = 'Добрый день 🌤️';
                sub = 'Продолжайте двигаться к целям';
            } else {
                greeting = 'Добрый вечер 🌆';
                sub = 'Время подвести итоги дня';
            }

            document.getElementById('greeting').textContent = greeting;
            document.getElementById('greetingSub').textContent = sub;
        }

        // ============================================================
        // 4. РЕНДЕРИНГ
        // ============================================================
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(date) {
            const d = String(date.getDate()).padStart(2, '0');
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const y = date.getFullYear();
            return `${d}.${m}.${y}`;
        }

        function renderCalendarMini() {
            const monthNames = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
            const year = selectedDate.getFullYear();
            const month = selectedDate.getMonth();
            document.getElementById('calMiniMonth').textContent = `${monthNames[month]} ${year}`;

            const firstDay = new Date(year, month, 1);
            const startDay = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1;
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const today = new Date();

            const tasks = currentData.tasks || [];

            let html = '';
            for (let i = 0; i < startDay; i++) html += '<div class="calendar-mini-day empty"></div>';
            for (let day = 1; day <= daysInMonth; day++) {
                const dateObj = new Date(year, month, day);
                const isToday = today.toDateString() === dateObj.toDateString();
                const dateStr = formatDate(dateObj);
                const hasEvent = tasks.some(t => t.text.includes(dateStr) && !t.done);

                let classes = 'calendar-mini-day';
                if (isToday) classes += ' today';
                if (hasEvent) classes += ' has-event';

                html += `<div class="${classes}">${day}</div>`;
            }
            document.getElementById('calMiniDays').innerHTML = html;
        }

        function renderWeekTasks() {
            const list = document.getElementById('weekList');
            const tasks = currentData.tasks || [];
            const now = new Date();
            const startOfWeek = new Date(now);
            startOfWeek.setDate(now.getDate() - now.getDay() + 1);
            startOfWeek.setHours(0, 0, 0, 0);
            const endOfWeek = new Date(startOfWeek);
            endOfWeek.setDate(startOfWeek.getDate() + 6);
            endOfWeek.setHours(23, 59, 59, 999);

            const weekTasks = tasks.filter(t => {
                const match = t.text.match(/(\d{2}\.\d{2}\.\d{4})/);
                if (match) {
                    const parts = match[1].split('.');
                    const date = new Date(parts[2], parts[1] - 1, parts[0]);
                    return date >= startOfWeek && date <= endOfWeek;
                }
                return false;
            });

            const done = weekTasks.filter(t => t.done).length;
            document.getElementById('weekDoneCount').textContent = done;
            document.getElementById('weekTotalCount').textContent = weekTasks.length;

            if (weekTasks.length === 0) {
                list.innerHTML = '<li class="week-item empty" style="justify-content:center; color:#b8c4d6;">Нет задач на эту неделю</li>';
                return;
            }

            list.innerHTML = weekTasks.map((task, i) => `
                <li class="week-item ${task.done ? 'done' : ''}" data-index="${i}">
                    <div class="week-item-check ${task.done ? 'done' : ''}" data-index="${i}">
                        ${task.done ? '✓' : ''}
                    </div>
                    <span class="week-item-text">${escapeHtml(task.text)}</span>
                    <button class="week-item-delete" data-index="${i}">🗑️</button>
                </li>
            `).join('');

            // Обработчики для чекбоксов и удаления
            list.querySelectorAll('.week-item-check').forEach(el => {
                el.addEventListener('click', async function() {
                    const idx = parseInt(this.dataset.index);
                    const tasks = currentData.tasks || [];
                    const weekTasks = tasks.filter(t => {
                        const match = t.text.match(/(\d{2}\.\d{2}\.\d{4})/);
                        if (match) {
                            const parts = match[1].split('.');
                            const date = new Date(parts[2], parts[1] - 1, parts[0]);
                            return date >= startOfWeek && date <= endOfWeek;
                        }
                        return false;
                    });
                    if (weekTasks[idx]) {
                        const taskText = weekTasks[idx].text;
                        const allTasks = tasks.map(t => {
                            if (t.text === taskText) {
                                return { ...t, done: !t.done };
                            }
                            return t;
                        });
                        await saveUserData({ ...currentData, tasks: allTasks });
                        await refreshData();
                    }
                });
            });

            list.querySelectorAll('.week-item-delete').forEach(el => {
                el.addEventListener('click', async function() {
                    const idx = parseInt(this.dataset.index);
                    const tasks = currentData.tasks || [];
                    const weekTasks = tasks.filter(t => {
                        const match = t.text.match(/(\d{2}\.\d{2}\.\d{4})/);
                        if (match) {
                            const parts = match[1].split('.');
                            const date = new Date(parts[2], parts[1] - 1, parts[0]);
                            return date >= startOfWeek && date <= endOfWeek;
                        }
                        return false;
                    });
                    if (weekTasks[idx]) {
                        const taskText = weekTasks[idx].text;
                        const allTasks = tasks.filter(t => t.text !== taskText);
                        await saveUserData({ ...currentData, tasks: allTasks });
                        await refreshData();
                    }
                });
            });
        }

        function renderNotes() {
            const grid = document.getElementById('notesGrid');
            const notes = currentData.notes || [];

            if (notes.length === 0) {
                grid.innerHTML = `
                    <div class="note-card" style="grid-column: span 2; text-align:center; color:#b8c4d6; justify-content:center; min-height:60px;">
                        Нет заметок
                    </div>
                `;
                return;
            }

            grid.innerHTML = notes.map((note, i) => `
                <div class="note-card" data-index="${i}">
                    <div class="note-card-text">${escapeHtml(note.text)}</div>
                    <div class="note-card-footer">
                        <span class="note-card-date">${note.date || ''}</span>
                        <button class="note-card-delete" data-index="${i}">🗑️</button>
                    </div>
                </div>
            `).join('');

            grid.querySelectorAll('.note-card-delete').forEach(el => {
                el.addEventListener('click', async function() {
                    const idx = parseInt(this.dataset.index);
                    const notes = currentData.notes || [];
                    notes.splice(idx, 1);
                    await saveUserData({ ...currentData, notes });
                    await refreshData();
                });
            });
        }

        async function refreshData() {
            const data = await fetchUserData();
            currentData = data;
            setGreeting();
            renderCalendarMini();
            renderWeekTasks();
            renderNotes();
        }

        // ============================================================
        // 5. НАВИГАЦИЯ ПО КАЛЕНДАРЮ
        // ============================================================
        document.getElementById('calMiniPrev').addEventListener('click', () => {
            selectedDate.setMonth(selectedDate.getMonth() - 1);
            renderCalendarMini();
        });

        document.getElementById('calMiniNext').addEventListener('click', () => {
            selectedDate.setMonth(selectedDate.getMonth() + 1);
            renderCalendarMini();
        });

        // ============================================================
        // 6. ВСПЛЫВАЮЩИЕ ОКНА
        // ============================================================
        const modalOverlay = document.getElementById('modalOverlay');
        const inputModal = document.getElementById('inputModal');
        const inputModalField = document.getElementById('inputModalField');
        const inputModalTitle = document.getElementById('inputModalTitle');

        // Открытие главного меню
        document.getElementById('fab').addEventListener('click', () => {
            modalOverlay.classList.add('active');
        });

        document.getElementById('modalClose').addEventListener('click', () => {
            modalOverlay.classList.remove('active');
        });

        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                modalOverlay.classList.remove('active');
            }
        });

        // Выбор типа добавления
        document.querySelectorAll('.modal-option').forEach(btn => {
            btn.addEventListener('click', function() {
                const type = this.dataset.type;
                currentModalType = type;
                modalOverlay.classList.remove('active');

                let title = 'Добавить задачу';
                let placeholder = 'Введите текст задачи...';
                if (type === 'event') {
                    title = 'Добавить событие в календарь';
                    placeholder = 'Введите событие...';
                } else if (type === 'note') {
                    title = 'Добавить заметку';
                    placeholder = 'Введите текст заметки...';
                }

                inputModalTitle.textContent = title;
                inputModalField.placeholder = placeholder;
                inputModalField.value = '';
                inputModal.classList.add('active');
                setTimeout(() => inputModalField.focus(), 300);
            });
        });

        // Закрытие окна ввода
        document.getElementById('inputModalCancel').addEventListener('click', () => {
            inputModal.classList.remove('active');
        });

        inputModal.addEventListener('click', (e) => {
            if (e.target === inputModal) {
                inputModal.classList.remove('active');
            }
        });

        // Подтверждение добавления
        document.getElementById('inputModalConfirm').addEventListener('click', async () => {
            const text = inputModalField.value.trim();
            if (!text) return;

            const tasks = currentData.tasks || [];
            const notes = currentData.notes || [];

            if (currentModalType === 'task') {
                tasks.push({ text, done: false });
                await saveUserData({ ...currentData, tasks });
            } else if (currentModalType === 'event') {
                const dateStr = formatDate(new Date());
                tasks.push({ text: `${text} (${dateStr})`, done: false });
                await saveUserData({ ...currentData, tasks });
            } else if (currentModalType === 'note') {
                notes.push({ text, date: new Date().toLocaleString() });
                await saveUserData({ ...currentData, notes });
            }

            inputModal.classList.remove('active');
            await refreshData();
        });

        inputModalField.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('inputModalConfirm').click();
            }
        });

        // ============================================================
        // 7. КНОПКА "СПИСОК ЗАДАЧ"
        // ============================================================
        document.getElementById('tasksSectionBtn').addEventListener('click', () => {
            // Переключаем на вкладку задач (если она есть)
            // Или показываем все задачи в отдельном окне
            const allTasks = currentData.tasks || [];
            if (allTasks.length === 0) {
                alert('У вас пока нет задач. Добавьте их через кнопку "+"');
                return;
            }

            let msg = '📋 Все задачи:\n\n';
            allTasks.forEach((t, i) => {
                msg += `${i+1}. ${t.done ? '✅' : '⬜'} ${t.text}\n`;
            });
            alert(msg);
        });

        // ============================================================
        // 8. ЗАПУСК
        // ============================================================
        refreshData();

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) refreshData();
        });

        console.log('✅ Tasky запущен');
    </script>

</body>
</html>
